<!DOCTYPE html> <!-- Tells the browser this file is a HTML file and to read it like it is one. -->
<html lang="en"> <!-- Defines where the content of the HTML starts. EDIT: Added 'lang="en"' to tell the browser 
                      what language this is written in.-->
    <head> <!-- Information about the website, such as the title.-->
        <meta charset="UTF-8"> <!-- Tells the browser what encoding system the website uses.-->
        <title>A Website</title> <!-- The title that shows up in the tab. -->
    </head>
    <body>
        <!-- This is where the content of the webpage is put, such as text, images, links, etc. -->
    </body>
</html>
